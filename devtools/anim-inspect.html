<!doctype html><html><body><script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
const out = {};
for (const n of ['Fast_Run', 'Hit_Reaction', 'Death_Forward', 'Great_Sword_Slash', 'Sword']) {
  const fbx = await new FBXLoader().loadAsync(`/assets-src/anims/${n}.fbx`);
  const B = {}; fbx.traverse((o) => { if (o.isBone) B[o.name.replace(/^mixamorig:?/, '')] = o; });
  const clip = fbx.animations[0];
  const mixer = new THREE.AnimationMixer(fbx); mixer.clipAction(clip).play();
  const fps = 30, nF = Math.round(clip.duration * fps);
  const hp = [], hs = [], ls = [];
  let prevR = null, prevL = null;
  for (let f = 0; f <= nF; f++) {
    mixer.setTime(f / fps); fbx.updateMatrixWorld(true);
    const h = B.Hips.getWorldPosition(new THREE.Vector3()), r = B.RightHand.getWorldPosition(new THREE.Vector3()), l = B.LeftHand.getWorldPosition(new THREE.Vector3());
    hp.push([+h.x.toFixed(0), +h.y.toFixed(0), +h.z.toFixed(0)]);
    hs.push(prevR ? +(r.distanceTo(prevR) * fps / 100).toFixed(1) : 0); ls.push(prevL ? +(l.distanceTo(prevL) * fps / 100).toFixed(1) : 0);
    prevR = r; prevL = l;
  }
  out[n] = { dur: +clip.duration.toFixed(3), frames: nF, hipStart: hp[0], hipEnd: hp[nF], hipMinY: Math.min(...hp.map((p) => p[1])), handSpeedR: hs, handSpeedL: ls };
}
window.__done = out;
</script></body></html>
